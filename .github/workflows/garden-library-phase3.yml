name: Garden Library Phase 3 plant profiles

on:
  push:
    paths:
      - .github/workflows/garden-library-phase3.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deduplicated plant profile database
        run: |
          python - <<'PY'
          import csv, json, re, hashlib
          from pathlib import Path
          from collections import defaultdict

          src=Path("data/garden-library/phase2/usda_3000_plants_phase2_verified.csv")
          outdir=Path("tools/garden-library")
          outdir.mkdir(parents=True,exist_ok=True)

          if not src.exists():
              raise SystemExit("Phase 2 verified CSV missing")

          def split_names(s):
              if not s: return []
              parts=re.split(r"\s*;\s*|\s*,\s*(?=[A-Za-z][A-Za-z -]+$)",s.strip())
              cleaned=[]
              for p in parts:
                  p=re.sub(r"\s+"," ",p).strip(" ;,")
                  if p and p not in cleaned: cleaned.append(p)
              return cleaned

          def slug(s):
              x=re.sub(r"[^a-z0-9]+","-",s.lower()).strip("-")
              return x or hashlib.sha1(s.encode()).hexdigest()[:12]

          groups={}
          with src.open("r",encoding="utf-8-sig",newline="") as f:
              rd=csv.DictReader(f)
              for r in rd:
                  status=(r.get("verification_status") or "").strip()
                  if status not in {"verified_accepted","verified_synonym"}:
                      continue
                  source=(r.get("scientific_name") or "").strip()
                  current=(r.get("wfo_current_scientific_name") or "").strip()
                  if not current:
                      current=source
                  if not current:
                      continue
                  key=current.casefold()
                  p=groups.setdefault(key,{
                    "scientificName":current,
                    "family":(r.get("wfo_current_family") or r.get("family") or "").strip(),
                    "commonNames":set(),
                    "synonyms":set(),
                    "historicalNames":set(),
                    "wfoIds":set(),
                    "wfoStatus":(r.get("wfo_taxonomic_status") or "").strip(),
                    "taxonomyChanged":False,
                    "familyChanged":False,
                    "sourceRecords":0,
                    "verification":"verified"
                  })
                  p["sourceRecords"]+=1
                  p["commonNames"].update(split_names(r.get("common_names") or ""))
                  if source and source.casefold()!=current.casefold():
                      p["synonyms"].add(source)
                      p["historicalNames"].add(source)
                  if (r.get("record_type") or "")=="synonym" and source:
                      p["synonyms"].add(source)
                  if (r.get("taxonomy_changed") or "")=="yes":
                      p["taxonomyChanged"]=True
                  if (r.get("family_changed") or "")=="yes":
                      p["familyChanged"]=True
                  if r.get("wfo_id"):
                      p["wfoIds"].add(r["wfo_id"].strip())

          profiles=[]
          for p in groups.values():
              commons=sorted(p["commonNames"],key=str.casefold)
              syns=sorted(p["synonyms"],key=str.casefold)
              historical=sorted(p["historicalNames"],key=str.casefold)
              display=commons[0] if commons else p["scientificName"]
              profiles.append({
                "id":slug(p["scientificName"]),
                "displayName":display,
                "scientificName":p["scientificName"],
                "family":p["family"],
                "commonNames":commons,
                "synonyms":syns,
                "historicalNames":historical,
                "wfoIds":sorted(p["wfoIds"]),
                "wfoStatus":p["wfoStatus"],
                "taxonomyChanged":p["taxonomyChanged"],
                "familyChanged":p["familyChanged"],
                "sourceRecords":p["sourceRecords"],
                "verification":"World Flora Online 2026-06"
              })

          profiles.sort(key=lambda x:(x["displayName"].casefold(),x["scientificName"].casefold()))
          (outdir/"plant_profiles.json").write_text(json.dumps(profiles,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          summary={
            "profileCount":len(profiles),
            "sourceVerifiedRecords":sum(p["sourceRecords"] for p in groups.values()),
            "withCommonNames":sum(bool(p["commonNames"]) for p in groups.values()),
            "withSynonyms":sum(bool(p["synonyms"]) for p in groups.values()),
            "taxonomyChangedProfiles":sum(bool(p["taxonomyChanged"]) for p in groups.values()),
            "familyChangedProfiles":sum(bool(p["familyChanged"]) for p in groups.values()),
            "verificationSource":"World Flora Online Plant List",
            "verificationVersion":"2026-06"
          }
          (outdir/"plant_profiles_summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          print(json.dumps(summary,indent=2))
          PY

      - name: Upgrade Garden Library interface with Plants
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("tools/garden-library/index.html")
          h=p.read_text(encoding="utf-8",errors="ignore")

          marker="phg-phase3-plants-v1"
          if marker in h:
              raise SystemExit("Phase 3 already installed")

          css=r'''
          <style id="phg-phase3-plants-v1">
          .phg-modebar{max-width:1160px;margin:0 auto 18px;padding:0 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
          .phg-modebtn{border:1px solid #cbd8c3;background:#fffaf2;color:#35543a;border-radius:999px;padding:10px 14px;font:700 14px Georgia,serif;cursor:pointer;transition:.16s}
          .phg-modebtn.active,.phg-modebtn:hover{background:#315936;color:#fff;border-color:#315936;transform:translateY(-1px)}
          .phg-plant-panel{display:none;max-width:1160px;margin:0 auto 26px;padding:0 18px}
          .phg-plant-panel.active{display:block}
          .phg-plant-app{background:#ffffffdf;border:1px solid #dfd5c8;border-radius:28px;box-shadow:0 18px 48px #29362224;overflow:hidden}
          .phg-plant-head{padding:20px;background:linear-gradient(#315236,#203622);color:#fff}
          .phg-plant-head h2{margin:0 0 5px;font:500 31px Georgia,serif}.phg-plant-head p{margin:0;color:#dbe7d5;line-height:1.5}
          .phg-plant-search{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:15px}.phg-plant-search input{width:100%;border:1px solid #ffffff44;background:#fffdf8;color:#35291f;border-radius:12px;padding:13px 14px;font:inherit;outline:none}.phg-plant-search button{border:0;border-radius:12px;background:#e8d2ab;color:#2d241d;padding:0 16px;font-weight:bold;cursor:pointer}
          .phg-plant-body{padding:22px}.phg-plant-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:#70665e;font-size:13px}
          .phg-plant-results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.phg-plant-card{background:#fffdf8;border:1px solid #e3dad0;border-radius:16px;padding:14px;cursor:pointer;transition:.15s}.phg-plant-card:hover{transform:translateY(-2px);border-color:#c3d2bb;box-shadow:0 10px 24px #34462e14}
          .phg-plant-card small{display:block;color:#71806a;text-transform:uppercase;letter-spacing:.08em;font-size:9px}.phg-plant-card h3{margin:5px 0 2px;color:#2c4b31;font:500 20px Georgia,serif}.phg-plant-card em{display:block;color:#5d6058;font-size:13px}.phg-plant-card p{margin:7px 0 0;color:#6a6158;line-height:1.4;font-size:12px}
          .phg-profile{display:none;margin:0 0 18px;background:linear-gradient(145deg,#eef4e9,#fffaf2);border:1px solid #cad8c2;border-radius:20px;padding:18px}.phg-profile.show{display:block}.phg-profile-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.phg-profile h2{margin:3px 0 2px;color:#234125;font:500 36px Georgia,serif}.phg-scientific{font-style:italic;color:#5f625a;font-size:18px}.phg-profile-badges{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}.phg-profile-badges span{background:#fffdf8;border:1px solid #cbd8c3;color:#35543a;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:bold}
          .phg-profile dl{display:grid;grid-template-columns:145px 1fr;gap:8px 12px;margin:16px 0}.phg-profile dt{font-weight:bold;color:#35543a}.phg-profile dd{margin:0;color:#675e55}.phg-audio{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.phg-audio button{border:0;border-radius:999px;background:#315936;color:#fff;padding:10px 13px;font-weight:bold;cursor:pointer}.phg-audio .secondary{background:#fffaf2;color:#35543a;border:1px solid #bfd0b8}
          .phg-imgbox{min-height:240px;border:1px solid #d7cec2;border-radius:16px;background:#f7f4ed;overflow:hidden;display:flex;align-items:center;justify-content:center}.phg-imgbox img{display:block;width:100%;height:260px;object-fit:cover}.phg-imgph{padding:20px;text-align:center;color:#776c63;font-size:13px}.phg-imgcredit{font-size:10px;color:#756a61;line-height:1.35;margin-top:6px}.phg-imgcredit a{color:#385f3a}
          .phg-aliases{margin-top:12px}.phg-aliases b{display:block;margin-bottom:6px;color:#2f4e33}.phg-aliaswrap{display:flex;gap:6px;flex-wrap:wrap}.phg-alias{background:#fffdf8;border:1px solid #d7cec2;border-radius:999px;padding:6px 8px;font-size:11px;color:#655d55}
          .phg-plant-pager{display:flex;justify-content:center;gap:8px;margin-top:16px}.phg-plant-pager button{border:1px solid #d3c7b7;background:#fffaf2;border-radius:10px;padding:8px 11px;cursor:pointer}.phg-plant-pager button:disabled{opacity:.4}
          .phg-phase-note{margin-top:16px;background:#f7ead3;border:1px solid #ead2a7;border-radius:15px;padding:13px 15px;color:#594b3d;font-size:13px;line-height:1.5}
          @media(max-width:900px){.phg-plant-results{grid-template-columns:repeat(2,1fr)}.phg-profile-grid{grid-template-columns:1fr}}
          @media(max-width:620px){.phg-modebar,.phg-plant-panel{padding-left:9px;padding-right:9px}.phg-plant-app{border-radius:18px}.phg-plant-head,.phg-plant-body{padding:14px}.phg-plant-results{grid-template-columns:1fr}.phg-plant-search{grid-template-columns:1fr}.phg-plant-search button{height:43px}.phg-profile h2{font-size:29px}.phg-profile dl{grid-template-columns:1fr}.phg-imgbox img{height:220px}}
          </style>
          '''

          html=r'''
          <div class="phg-modebar" id="phgModeBar">
            <button class="phg-modebtn active" data-mode="plants">PLANTS</button>
            <button class="phg-modebtn" data-mode="terms">GARDEN TERMS</button>
            <button class="phg-modebtn" data-mode="resources">RESOURCES</button>
          </div>

          <section class="phg-plant-panel active" id="phgPlantsPanel">
            <div class="phg-plant-app">
              <div class="phg-plant-head">
                <h2>Perennial Plant Records</h2>
                <p>Search verified plant names, common names, families and historical synonyms from the Perennial Garden Library.</p>
                <div class="phg-plant-search"><input id="phgPlantSearch" placeholder="Search yarrow, Achillea millefolium, Asteraceae…"><button id="phgPlantSearchBtn">Search Plants</button></div>
              </div>
              <div class="phg-plant-body">
                <div class="phg-profile" id="phgPlantProfile">
                  <div class="phg-profile-grid">
                    <div>
                      <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#667c61;font-weight:bold">Verified Plant Profile</div>
                      <h2 id="phgPlantName"></h2>
                      <div class="phg-scientific" id="phgScientific"></div>
                      <div class="phg-profile-badges" id="phgPlantBadges"></div>
                      <dl>
                        <dt>Family</dt><dd id="phgFamily"></dd>
                        <dt>Common names</dt><dd id="phgCommon"></dd>
                        <dt>Current taxonomy</dt><dd id="phgTaxonomy"></dd>
                        <dt>Verification</dt><dd id="phgVerification"></dd>
                      </dl>
                      <div class="phg-aliases" id="phgAliasesBox"><b>Historical / synonym names</b><div class="phg-aliaswrap" id="phgAliases"></div></div>
                      <div class="phg-audio"><button id="phgSpeakScientific">🔊 Hear scientific name</button><button class="secondary" id="phgSpeakSummary">🔊 Hear plant record</button></div>
                    </div>
                    <div><div class="phg-imgbox" id="phgPlantImage"><div class="phg-imgph">Select a plant to load an openly licensed reference image when available.</div></div><div class="phg-imgcredit" id="phgPlantCredit"></div></div>
                  </div>
                </div>
                <div class="phg-plant-meta"><span id="phgPlantCount">Loading verified plant profiles…</span><span>Verified against World Flora Online • June 2026</span></div>
                <div class="phg-plant-results" id="phgPlantResults"></div>
                <div class="phg-plant-pager"><button id="phgPlantPrev">← Previous</button><button id="phgPlantNext">Next →</button></div>
                <div class="phg-phase-note"><strong>Plant profile foundation:</strong> this phase establishes authoritative names, families, common names, synonyms and images. Growing zones, sun, water, soil, size, bloom, propagation, wildlife value, pests and other care fields will be layered onto these same records rather than creating a separate database.</div>
              </div>
            </div>
          </section>
          '''

          js=r'''
          <script id="phg-phase3-plants-js">
          (function(){
            let P=[],page=0,current=null;const PAGE=24;
            const $=id=>document.getElementById(id);

            function mode(m){
              document.querySelectorAll(".phg-modebtn").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
              $("phgPlantsPanel").classList.toggle("active",m==="plants");
              const glossary=document.querySelector(".glossary");
              const resourceHead=document.querySelector(".resource-head");
              const resources=document.querySelector(".resources");
              if(glossary) glossary.style.display=m==="terms"?"block":"none";
              if(resourceHead) resourceHead.style.display=m==="resources"?"block":"none";
              if(resources) resources.style.display=m==="resources"?"grid":"none";
            }
            document.querySelectorAll(".phg-modebtn").forEach(b=>b.onclick=()=>mode(b.dataset.mode));

            function norm(s){return (s||"").toLowerCase()}
            function filtered(){
              let q=norm($("phgPlantSearch").value).trim();
              if(!q)return P;
              return P.filter(x=>{
                let blob=[x.displayName,x.scientificName,x.family,...(x.commonNames||[]),...(x.synonyms||[])].join(" ").toLowerCase();
                return blob.includes(q);
              });
            }
            function render(){
              let a=filtered(),max=Math.max(0,Math.ceil(a.length/PAGE)-1);
              if(page>max)page=max;
              const start=page*PAGE, box=$("phgPlantResults");box.innerHTML="";
              $("phgPlantCount").textContent=a.length.toLocaleString()+" verified plant profile"+(a.length===1?"":"s");
              a.slice(start,start+PAGE).forEach(x=>{
                let c=document.createElement("article");c.className="phg-plant-card";
                let common=(x.commonNames&&x.commonNames.length)?x.commonNames.slice(0,3).join(" · "):"No common name in historical source";
                c.innerHTML="<small>"+(x.family||"Family not listed")+"</small><h3>"+x.displayName+"</h3><em>"+x.scientificName+"</em><p>"+common+"</p>";
                c.onclick=()=>openProfile(x);box.appendChild(c);
              });
              if(!a.length)box.innerHTML='<div class="empty"><b>No matching plant found.</b><br>Try a scientific name, common name or family.</div>';
              $("phgPlantPrev").disabled=page<=0;$("phgPlantNext").disabled=page>=max;
            }
            $("phgPlantSearch").oninput=()=>{page=0;render()};
            $("phgPlantSearchBtn").onclick=()=>{page=0;render();let a=filtered();if(a.length===1)openProfile(a[0])};
            $("phgPlantSearch").addEventListener("keydown",e=>{if(e.key==="Enter")$("phgPlantSearchBtn").click()});
            $("phgPlantPrev").onclick=()=>{if(page>0){page--;render();$("phgPlantResults").scrollIntoView({behavior:"smooth",block:"start"})}};
            $("phgPlantNext").onclick=()=>{page++;render();$("phgPlantResults").scrollIntoView({behavior:"smooth",block:"start"})};

            function speak(t){if(!("speechSynthesis" in window)){alert("Speech playback is not available in this browser.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)}
            $("phgSpeakScientific").onclick=()=>current&&speak(current.scientificName);
            $("phgSpeakSummary").onclick=()=>current&&speak((current.displayName||"")+". Scientific name "+current.scientificName+". Family "+(current.family||"not listed")+". Common names "+((current.commonNames||[]).join(", ")||"not listed")+".");

            function openProfile(x){
              current=x;$("phgPlantProfile").classList.add("show");
              $("phgPlantName").textContent=x.displayName||x.scientificName;
              $("phgScientific").textContent=x.scientificName;
              $("phgFamily").textContent=x.family||"Not listed";
              $("phgCommon").textContent=(x.commonNames||[]).join(", ")||"No common name listed in the historical source";
              $("phgTaxonomy").textContent=x.taxonomyChanged?"Updated from one or more historical names":"Historical source name remains current in this verified record";
              $("phgVerification").textContent=x.verification;
              let badges=$("phgPlantBadges");badges.innerHTML="";
              [x.wfoStatus||"accepted",x.taxonomyChanged?"taxonomy updated":"current name verified",x.familyChanged?"family updated":""].filter(Boolean).forEach(t=>{let s=document.createElement("span");s.textContent=t;badges.appendChild(s)});
              let aliases=$("phgAliases"),names=[...(x.synonyms||[]),...(x.historicalNames||[])].filter((v,i,a)=>a.indexOf(v)===i);
              aliases.innerHTML="";$("phgAliasesBox").style.display=names.length?"block":"none";
              names.forEach(n=>{let s=document.createElement("span");s.className="phg-alias";s.textContent=n;aliases.appendChild(s)});
              loadImage(x);
              history.replaceState(null,"","#plant-"+x.id);
              $("phgPlantProfile").scrollIntoView({behavior:"smooth",block:"center"});
            }

            async function loadImage(x){
              let box=$("phgPlantImage"),credit=$("phgPlantCredit");box.innerHTML='<div class="phg-imgph">Looking for an openly licensed reference image…</div>';credit.textContent="";
              let q=x.scientificName+" plant";
              try{
                let url="https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch="+encodeURIComponent(q)+"&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=900&format=json";
                let r=await fetch(url),j=await r.json(),pages=j.query&&j.query.pages?Object.values(j.query.pages):[];
                let p=pages.find(y=>y.imageinfo&&y.imageinfo[0]&&(y.imageinfo[0].thumburl||y.imageinfo[0].url));
                if(!p)throw 0;
                let ii=p.imageinfo[0],m=ii.extmetadata||{},img=ii.thumburl||ii.url;
                box.innerHTML='<img src="'+img+'" alt="'+(x.displayName||x.scientificName).replace(/"/g,"&quot;")+'">';
                let artist=((m.Artist&&m.Artist.value)||"Wikimedia Commons contributor").replace(/<[^>]*>/g,"");
                let lic=(m.LicenseShortName&&m.LicenseShortName.value)||"";
                let src="https://commons.wikimedia.org/wiki/"+encodeURIComponent(p.title.replace(/ /g,"_"));
                credit.innerHTML='Image: '+artist+(lic?" · "+lic:"")+' · <a href="'+src+'" target="_blank" rel="noopener">source & license</a>';
              }catch(e){box.innerHTML='<div class="phg-imgph">No suitable open reference image was found automatically for this plant yet.</div>'}
            }

            fetch("plant_profiles.json",{cache:"no-store"}).then(r=>r.json()).then(data=>{
              P=data;$("termBadge").textContent=(P.length+DATA?.length||P.length).toLocaleString()+" library records";
              render();
              let h=decodeURIComponent(location.hash.replace("#",""));
              if(h.startsWith("plant-")){let x=P.find(p=>"plant-"+p.id===h);if(x)openProfile(x)}
            }).catch(()=>{$("phgPlantCount").textContent="Plant profile database is temporarily unavailable."});

            // Default first visit to Plants; hash for glossary terms switches to Terms.
            let hash=location.hash.replace("#","");
            if(hash && !hash.startsWith("plant-")) mode("terms"); else mode("plants");
          })();
          </script>
          '''

          # Insert CSS before </head>
          h=h.replace("</head>",css+"</head>",1)
          # Insert mode bar and plant section before the existing <main class="shell">
          needle='<main class="shell">'
          if needle not in h:
              raise SystemExit("Garden Library main container not found")
          h=h.replace(needle,html+needle,1)
          # Insert JS before existing final </body>
          h=h.replace("</body>",js+"</body>",1)
          p.write_text(h,encoding="utf-8")
          PY

      - name: Commit Phase 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/garden-library/index.html tools/garden-library/plant_profiles.json tools/garden-library/plant_profiles_summary.json
          git diff --cached --quiet || git commit -m "Garden Library Phase 3: add verified plant profile system"
          git push
