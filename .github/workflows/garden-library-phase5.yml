name: Garden Library Phase 5

on:
  push:
    paths:
      - .github/workflows/garden-library-phase5.yml
      - .github/scripts/garden_library_phase5.py

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: pip install -q beautifulsoup4
      - name: Build Phase 5 data and UI
        run: python .github/scripts/garden_library_phase5.py
      - name: Commit Phase 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/garden-library/index.html tools/garden-library/plant_care_enrichment.json tools/garden-library/plant_care_enrichment_summary.json
          git diff --cached --quiet || git commit -m "Garden Library Phase 5: add Extension care data and trusted resources"
          git push
