name: Verify Perennial build 3
on:
  push:
    branches: [garden-build3-20261020]
permissions:
  contents: write
concurrency:
  group: perennial-build3
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: garden-build3-20261020
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare page updates
        run: |
          python -m pip install beautifulsoup4 playwright
          python .github/scripts/build3_pages.py
          cp .github/scripts/reader-check.html reader-check.html
          node --check app-assets/site-experience.js
          node --check app-assets/install.js
          node --check app-assets/reader-setup.js
          node --check app-assets/reader-comfort.js
          node --check app-assets/read-aloud.js
      - name: Prepare browser
        run: python -m playwright install chromium --with-deps
      - name: Check header, contact, garden tools, campaigns and reading controls
        run: python .github/scripts/test_build3.py
      - name: Save verified page updates
        run: |
          rm reader-check.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools app-assets
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified compact header and campaign updates to pages"
            git push origin HEAD:garden-build3-20261020
          fi
