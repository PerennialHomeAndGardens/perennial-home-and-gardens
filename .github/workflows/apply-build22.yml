name: Apply Build 22 navigation cleanup

on:
  push:
    paths:
      - .github/workflows/apply-build22.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Perennial site
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit Build 22
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Build 22: refine navigation and visitor copy"
          git push
