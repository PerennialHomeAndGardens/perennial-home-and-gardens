name: Apply Build 23 responsive navigation polish

on:
  push:
    paths:
      - .github/workflows/apply-build23.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish responsive navigation
        run: python -c "import base64;exec(base64.b64decode(' '))"
      - name: Commit Build 23
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Build 23: polish responsive navigation"
          git push
