name: Verify twelve-tool homepage and article offers
on:
  push:
    branches: [organize-home-20261021]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 playwright
      - run: |
          python .github/scripts/organize_home.py
          node --check app-assets/site-experience.js
          python -m playwright install chromium --with-deps
      - run: python .github/scripts/test_final_build.py
      - run: python .github/scripts/test_navigation_polish.py
      - run: python .github/scripts/test_home_organization.py
      - name: Save verified organized pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools articles legal app-assets qa
          git diff --cached --quiet || git commit -m 'Generate verified twelve-tool homepage and article offers'
          git push
