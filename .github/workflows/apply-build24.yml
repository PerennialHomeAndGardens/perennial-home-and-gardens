name: Apply Build 24 final navigation polish

on:
  push:
    paths:
      - .github/workflows/apply-build24.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final navigation polish
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit Build 24
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Build 24: stabilize navigation and interactions"
          git push
