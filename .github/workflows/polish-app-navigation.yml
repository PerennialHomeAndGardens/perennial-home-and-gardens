name: Verify app navigation polish and expanded Tanya references
on:
  push:
    branches: [polish-app-navigation-20261020]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 playwright
      - run: |
          python .github/scripts/polish_navigation.py
          python .github/scripts/build_tanya_reference.py
          node --check app-assets/site-experience.js
          node --check app-assets/app-navigation.js
          node --check app-assets/tanya-reference.js
          python -m playwright install chromium --with-deps
      - run: python .github/scripts/test_final_build.py
      - run: python .github/scripts/test_navigation_polish.py
      - name: Save verified pages and compressed reference assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools articles legal app-assets qa
          git diff --cached --quiet || git commit -m 'Generate verified static app header, simplified previews and compact Tanya references'
          git push
