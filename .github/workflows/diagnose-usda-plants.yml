name: Diagnose USDA PLANTS API

on:
  push:
    paths:
      - .github/workflows/diagnose-usda-plants.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect USDA PLANTS app bundle
        run: |
          python - <<'PY'
          import urllib.request,re,json
          base="https://plants.sc.egov.usda.gov/"
          req=urllib.request.Request(base+"main.js",headers={"User-Agent":"Mozilla/5.0"})
          js=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
          pats=[
            r'https?://[^"\'\\ ]+',
            r'["\']([^"\']*(?:api|characteristic|plant-profile|plants)[^"\']*)["\']'
          ]
          found=[]
          for pat in pats:
            for m in re.findall(pat,js,re.I):
              s=m if isinstance(m,str) else str(m)
              if 4 < len(s) < 500:
                found.append(s)
          # Keep unique URL/API-ish strings.
          seen=[]
          for s in found:
            if s not in seen: seen.append(s)
          data={"bundle_len":len(js),"strings":seen[:5000]}
          open("data/garden-library/usda_api_diagnostic.json","w").write(json.dumps(data,indent=2))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/garden-library/usda_api_diagnostic.json
          git diff --cached --quiet || git commit -m "Inspect USDA PLANTS app API strings"
          git push
