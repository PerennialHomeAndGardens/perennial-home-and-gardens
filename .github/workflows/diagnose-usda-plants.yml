name: Diagnose USDA PLANTS API

on:
  push:
    paths:
      - .github/workflows/diagnose-usda-plants.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sample USDA PLANTS enrichment payloads
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, json
          base="https://plantsservices.sc.egov.usda.gov/api/"
          def get(path):
              req=urllib.request.Request(base+path,headers={"User-Agent":"PerennialHomeGardens/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=40) as r:
                  raw=r.read().decode("utf-8","replace")
                  try:return json.loads(raw)
                  except:return {"raw":raw[:10000]}
          out={}
          out["search"]=get("PlantSearch?searchText="+urllib.parse.quote("Achillea millefolium"))
          out["all_characteristic_search"]=get("characteristicSearchResults")
          # Find a plausible numeric id from search response recursively.
          ids=[]
          def scan(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k.lower() in {"id","plantid","plant_id"} and isinstance(v,(int,str)) and str(v).isdigit(): ids.append(str(v))
                      scan(v)
              elif isinstance(x,list):
                  for v in x:scan(v)
          scan(out["search"])
          if ids:
              out["characteristics"]=get("PlantCharacteristics/"+ids[0])
              out["profile"]=get("PlantProfile/"+ids[0])
              out["sample_id"]=ids[0]
          # Trim the all-list if huge.
          a=out.get("all_characteristic_search")
          if isinstance(a,list) and len(a)>10:
              out["all_characteristic_search_count"]=len(a)
              out["all_characteristic_search"]=a[:10]
          open("data/garden-library/usda_api_diagnostic.json","w").write(json.dumps(out,indent=2)[:500000])
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/garden-library/usda_api_diagnostic.json
          git diff --cached --quiet || git commit -m "Sample USDA PLANTS enrichment payloads"
          git push
