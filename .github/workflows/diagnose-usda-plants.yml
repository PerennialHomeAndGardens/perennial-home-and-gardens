name: Diagnose USDA PLANTS API

on:
  push:
    paths:
      - .github/workflows/diagnose-usda-plants.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect USDA PLANTS API config
        run: |
          python - <<'PY'
          import urllib.request,re,json
          js=urllib.request.urlopen(urllib.request.Request("https://plants.sc.egov.usda.gov/main.js",headers={"User-Agent":"Mozilla/5.0"}),timeout=40).read().decode("utf-8","replace")
          needles=["getPlantsAPIUrl","plantsAPI","fetchPlantProfile","PlantProfile/get","getCharacteristics","characteristicSearchResults","serviceUrl"]
          out={}
          for n in needles:
            arr=[];start=0
            while True:
              i=js.find(n,start)
              if i<0:break
              arr.append(js[max(0,i-1800):min(len(js),i+5000)])
              if len(arr)>=20:break
              start=i+len(n)
            out[n]=arr
          open("data/garden-library/usda_api_diagnostic.json","w").write(json.dumps(out,indent=2))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/garden-library/usda_api_diagnostic.json
          git diff --cached --quiet || git commit -m "Inspect USDA PLANTS API configuration"
          git push
