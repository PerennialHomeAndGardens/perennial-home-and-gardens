name: Verify manual email and download handoffs
on:
  push:
    branches: [launch-email-20261023]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright pillow beautifulsoup4
      - name: Use test browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo 'PHG_QA_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            python -m playwright install chromium --with-deps
          fi
      - run: node --check app-assets/site-experience.js
      - run: python .github/scripts/test_manual_email.py
      - run: python .github/scripts/test_all_garden_tools.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-email-and-tools-checks
          path: qa/
      - name: Save verified results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/manual-email-* qa/tools-functional-20261022.*
          git diff --cached --quiet || git commit -m 'Record manual email and garden-tool regression results'
          git push
