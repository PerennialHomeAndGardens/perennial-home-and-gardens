name: Inspect garden experience
on:
  push:
    paths: ['.github/workflows/inspect-garden-experience.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect navigation and assistant
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          s=re.sub(r'data:[^;"\s]+;base64,[A-Za-z0-9+/=]+','[embedded asset]',s)
          print('BEGIN_SANITIZED_SOURCE')
          print(s)
          print('END_SANITIZED_SOURCE')
          PY
