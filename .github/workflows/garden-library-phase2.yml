name: Garden Library Phase 2 taxonomy verification

on:
  push:
    paths:
      - .github/workflows/garden-library-phase2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download USDA 1977 source and WFO 2026-06 backbone
        run: |
          python - <<'PY'
          import urllib.request
          sources={
            "/tmp/usda3000.pdf":"https://www.govinfo.gov/content/pkg/GOVPUB-A-PURL-gpo28463/pdf/GOVPUB-A-PURL-gpo28463.pdf",
            "/tmp/wfo.zip":"https://zenodo.org/records/20782718/files/_DwC_backbone_R.zip?download=1",
          }
          for dst,url in sources.items():
              print("Downloading",url)
              urllib.request.urlretrieve(url,dst)
          PY
          pdftotext -layout /tmp/usda3000.pdf /tmp/usda3000.txt
          unzip -q /tmp/wfo.zip -d /tmp/wfo

      - name: Extract historical records and verify with current WFO
        run: |
          python - <<'PY'
          import csv, json, re, unicodedata, xml.etree.ElementTree as ET
          from pathlib import Path
          from collections import Counter, defaultdict

          OUT=Path("data/garden-library/phase2")
          OUT.mkdir(parents=True,exist_ok=True)

          # -----------------------
          # A. Re-extract Phase 1 source records from the USDA handbook.
          # -----------------------
          text=Path("/tmp/usda3000.txt").read_text(encoding="utf-8",errors="ignore")
          if "PART I." not in text or "PART II." not in text:
              raise SystemExit("Could not locate Part I / Part II boundaries in USDA source")
          part=text.split("PART I.",1)[1].split("PART II.",1)[0]
          lines=part.splitlines()

          header_re=re.compile(r"^\s*([A-Z][A-Za-zÀ-ÖØ-öø-ÿ0-9.:'-]+)\s+\(([^)]+)\)(?:\s+\[TN\])?\s*$")
          cont_re=re.compile(r"^\s*([A-Z][A-Za-zÀ-ÖØ-öø-ÿ0-9.:'-]+)\s+\(continued\)\s*$")
          source_rows=[]
          genus=""
          family=""
          buf=""

          ranks={"var.","subsp.","ssp.","f.","forma","cv.","group","Group"}

          def flush(entry):
              nonlocal_dummy=None
              s=entry.strip()
              if not s or not genus or re.fullmatch(r"\d+",s):
                  return
              record_type="synonym" if s.startswith("(") else "accepted"
              common=""
              core=s
              if "--" in core:
                  core,common=core.split("--",1)
                  common=common.strip()
              elif " - - " in core:
                  core,common=core.split(" - - ",1)
                  common=common.strip()

              target=""
              if "=" in core:
                  left,target=core.split("=",1)
                  core=left.strip()
                  target=target.strip()
                  record_type="synonym"

              core=re.sub(r"\s*\[(?:TN|NC)\]\s*"," ",core).strip()
              flags=";".join(re.findall(r"\[(TN|NC)\]",s))
              if record_type=="synonym":
                  if core.startswith("("): core=core[1:].strip()
                  if core.endswith(")"): core=core[:-1].strip()

              toks=core.split()
              if not toks:
                  return
              if toks[0].casefold().rstrip(".,")==genus.casefold().rstrip(".,"):
                  full=core
              else:
                  full=genus+" "+core
              ft=full.split()
              if len(ft)<2:
                  return
              canon=[ft[0].strip("()"),ft[1].strip("()")]
              i=2
              while i<len(ft):
                  t=ft[i].strip("(),")
                  if t in ranks and i+1<len(ft):
                      canon += [t,ft[i+1].strip("(),")]
                      i+=2
                      continue
                  if t in {"X","x","×"} and i+2<len(ft):
                      canon += ["×",ft[i+1].strip("(),"),ft[i+2].strip("(),")]
                      i+=3
                      continue
                  if i+1<len(ft) and ft[i+1].lower().strip("(),")=="group":
                      canon += [ft[i].strip("(),"),"Group"]
                      i+=2
                      continue
                  break
              scientific=" ".join(canon)
              authorship=full[len(scientific):].strip(" -") if full.casefold().startswith(scientific.casefold()) else ""

              if target:
                  m=re.match(r"^([A-Z])\.\s+(.*)$",target)
                  if m and genus.startswith(m.group(1)):
                      target=genus+" "+m.group(2)

              source_rows.append({
                "record_type":record_type,
                "genus":genus,
                "family":family,
                "scientific_name":scientific,
                "authorship":authorship,
                "common_names":common,
                "synonym_of":target,
                "flags":flags,
                "source_raw":s
              })

          for raw in lines:
              line=raw.replace("\f","")
              m=header_re.match(line)
              if m:
                  if buf: flush(buf); buf=""
                  genus=m.group(1); family=m.group(2)
                  continue
              m=cont_re.match(line)
              if m:
                  if buf: flush(buf); buf=""
                  genus=m.group(1)
                  continue
              st=line.strip()
              if not st:
                  if buf: flush(buf); buf=""
                  continue
              if not genus or st.startswith("PART ") or re.fullmatch(r"\d+",st):
                  continue
              indent=len(line)-len(line.lstrip())
              is_new=indent<=5 and (st.startswith("(") or re.match(r"^[A-Za-zÀ-ÖØ-öø-ÿ][\wÀ-ÖØ-öø-ÿ.-]*",st))
              if is_new:
                  if buf: flush(buf)
                  buf=st
              else:
                  if buf: buf += " "+st
          if buf: flush(buf)

          print("USDA extracted records:",len(source_rows))

          # -----------------------
          # B. Load the WFO 2026-06 Darwin Core backbone.
          # -----------------------
          def norm(s):
              s=(s or "").strip()
              s=unicodedata.normalize("NFKD",s)
              s="".join(c for c in s if not unicodedata.combining(c))
              s=s.replace("×","x")
              s=re.sub(r"\s+"," ",s)
              return s.casefold()

          # WFO June 2026 backbone ships as a tab-delimited classification.csv.
          corefile=Path("/tmp/wfo/classification.csv")
          if not corefile.exists():
              raise SystemExit("WFO classification.csv not found")

          by_name=defaultdict(list)
          by_gs=defaultdict(list)
          by_id={}

          with corefile.open("r",encoding="utf-8",errors="replace",newline="") as fh:
              rd=csv.DictReader(fh,delimiter="\t")
              required={"taxonID","scientificName","taxonomicStatus","acceptedNameUsageID","family","genus","specificEpithet"}
              missing=required-set(rd.fieldnames or [])
              if missing:
                  raise SystemExit(f"WFO classification.csv missing expected columns: {sorted(missing)}")
              print("Using WFO table:",corefile,corefile.stat().st_size)
              print("WFO columns:",len(rd.fieldnames or []))

              for row in rd:
                  tid=(row.get("taxonID") or "").strip()
                  sci=(row.get("scientificName") or "").strip()
                  genus=(row.get("genus") or "").strip()
                  species=(row.get("specificEpithet") or "").strip()
                  infra=(row.get("infraspecificEpithet") or "").strip()

                  # classification.csv does not always include canonicalName.
                  # Build a conservative canonical form from structured fields.
                  parts=[genus,species]
                  if infra:
                      rank=(row.get("taxonRank") or "").strip().lower()
                      rank_token={
                        "subspecies":"subsp.","variety":"var.","form":"f.",
                        "subsp.":"subsp.","var.":"var.","f.":"f."
                      }.get(rank,"")
                      if rank_token:
                          parts += [rank_token,infra]
                      else:
                          parts += [infra]
                  canonical=" ".join(x for x in parts if x)

                  rec={
                    "id":tid,
                    "scientific_name":sci,
                    "canonical_name":canonical,
                    "authorship":(row.get("scientificNameAuthorship") or "").strip(),
                    "status":(row.get("taxonomicStatus") or "").strip(),
                    "accepted_id":(row.get("acceptedNameUsageID") or "").strip(),
                    "accepted_name":"",
                    "rank":(row.get("taxonRank") or "").strip(),
                    "family":(row.get("family") or "").strip(),
                    "genus":genus,
                    "species":species
                  }
                  if tid:
                      by_id[tid]=rec
                  for k in {norm(sci),norm(canonical)}:
                      if k:
                          by_name[k].append(rec)
                  if genus and species:
                      by_gs[(norm(genus),norm(species))].append(rec)

          print("WFO records indexed:",len(by_id))

          for rec in by_id.values():
              if rec["accepted_id"] and not rec["accepted_name"] and rec["accepted_id"] in by_id:
                  rec["accepted_name"]=by_id[rec["accepted_id"]]["scientific_name"]

          # -----------------------
          # C. Verify.
          # -----------------------
          counts=Counter()
          verified=[]
          review=[]
          accepted_tokens={"accepted","accepted name"}

          for r in source_rows:
              q=r["scientific_name"]
              candidates=list({m["id"]:m for m in by_name.get(norm(q),[]) if m["id"]}.values())
              method="exact_name"
              conf=1.0

              if not candidates:
                  bits=q.split()
                  if len(bits)>=2:
                      candidates=list({m["id"]:m for m in by_gs.get((norm(bits[0]),norm(bits[1])),[]) if m["id"]}.values())
                      method="genus_species_exact"
                      conf=0.97

              chosen=None
              note=""
              if len(candidates)==1:
                  chosen=candidates[0]
              elif len(candidates)>1:
                  exact=[m for m in candidates if norm(m["canonical_name"])==norm(q)]
                  if len(exact)==1:
                      chosen=exact[0]
                  else:
                      accepted=[m for m in candidates if norm(m["status"]) in accepted_tokens]
                      if len(accepted)==1:
                          chosen=accepted[0]
                          conf=0.92
                          note="Multiple WFO name records; unique accepted record selected."
                      else:
                          note=f"Ambiguous WFO match ({len(candidates)} records)."

              out=dict(r)
              out.update({
                "verification_status":"",
                "wfo_id":"",
                "wfo_taxonomic_status":"",
                "wfo_current_scientific_name":"",
                "wfo_accepted_name":"",
                "wfo_accepted_id":"",
                "wfo_current_family":"",
                "wfo_rank":"",
                "match_method":"",
                "match_confidence":"",
                "taxonomy_changed":"",
                "family_changed":"",
                "phase2_notes":"",
                "verification_source":"World Flora Online Plant List",
                "verification_version":"2026-06"
              })

              if chosen:
                  st=norm(chosen["status"])
                  accepted_name=chosen["accepted_name"]
                  current=accepted_name or chosen["scientific_name"]
                  if st in accepted_tokens:
                      status="verified_accepted"
                      current=chosen["scientific_name"]
                  elif chosen["accepted_id"] or "synonym" in st:
                      status="verified_synonym"
                  else:
                      status="matched_status_review"
                  out.update({
                    "verification_status":status,
                    "wfo_id":chosen["id"],
                    "wfo_taxonomic_status":chosen["status"],
                    "wfo_current_scientific_name":current,
                    "wfo_accepted_name":accepted_name,
                    "wfo_accepted_id":chosen["accepted_id"],
                    "wfo_current_family":chosen["family"],
                    "wfo_rank":chosen["rank"],
                    "match_method":method,
                    "match_confidence":f"{conf:.2f}",
                    "taxonomy_changed":"yes" if current and norm(current)!=norm(q) else "no",
                    "family_changed":"yes" if r["family"] and chosen["family"] and norm(r["family"])!=norm(chosen["family"]) else "no",
                    "phase2_notes":note
                  })
                  counts[status]+=1
                  if out["taxonomy_changed"]=="yes": counts["taxonomy_changed"]+=1
                  if out["family_changed"]=="yes": counts["family_changed"]+=1
              else:
                  status="ambiguous" if candidates else "unresolved"
                  out["verification_status"]=status
                  out["match_method"]=method if candidates else ""
                  out["match_confidence"]=f"{conf:.2f}" if candidates else "0.00"
                  out["phase2_notes"]=note or "No exact WFO match. Manual review required; no modern name was guessed."
                  counts[status]+=1
                  review.append(out)

              verified.append(out)

          fields=list(verified[0].keys())
          with (OUT/"usda_3000_plants_phase2_verified.csv").open("w",encoding="utf-8-sig",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(verified)
          with (OUT/"phase2_unresolved_review.csv").open("w",encoding="utf-8-sig",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(review)

          app=[{
            "sourceScientificName":r["scientific_name"],
            "commonNames":r["common_names"],
            "sourceFamily":r["family"],
            "sourceRecordType":r["record_type"],
            "verificationStatus":r["verification_status"],
            "currentScientificName":r["wfo_current_scientific_name"],
            "currentFamily":r["wfo_current_family"],
            "wfoId":r["wfo_id"],
            "wfoStatus":r["wfo_taxonomic_status"],
            "acceptedName":r["wfo_accepted_name"],
            "taxonomyChanged":r["taxonomy_changed"]
          } for r in verified]
          (OUT/"plant_index_phase2.json").write_text(json.dumps(app,ensure_ascii=False,separators=(",",":")),encoding="utf-8")

          summary={
            "source_records":len(source_rows),
            "verification_source":"World Flora Online Plant List",
            "verification_version":"2026-06",
            "verified_accepted":counts["verified_accepted"],
            "verified_synonym":counts["verified_synonym"],
            "matched_status_review":counts["matched_status_review"],
            "ambiguous":counts["ambiguous"],
            "unresolved":counts["unresolved"],
            "taxonomy_changed":counts["taxonomy_changed"],
            "family_changed":counts["family_changed"],
            "verified_or_matched":counts["verified_accepted"]+counts["verified_synonym"]+counts["matched_status_review"],
            "method_note":"Exact normalized scientific-name matching, with conservative genus/species fallback. Unresolved names were not guessed."
          }
          (OUT/"phase2_summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          (OUT/"PHASE2-README.txt").write_text(
             "Perennial Garden Library — Phase 2 Taxonomy Verification\n\n"
             "Historical source: USDA Agriculture Handbook 505 (1977).\n"
             "Modern reference: World Flora Online Plant List 2026-06.\n"
             "Current taxonomy was matched conservatively. Unresolved records remain queued for manual review.\n\n"
             + json.dumps(summary,indent=2),
             encoding="utf-8"
          )
          print(json.dumps(summary,indent=2))
          PY

      - name: Commit Phase 2 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/garden-library/phase2
          git diff --cached --quiet || git commit -m "Garden Library Phase 2: verify plant taxonomy against WFO 2026-06"
          git push
