name: Verify required gift capture without sending email
on:
  push:
    branches: [gifts-capture-20261023]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Use test browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo 'PHG_QA_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            python -m playwright install chromium --with-deps
          fi
      - run: node --check app-assets/gift-capture.js
      - run: node --check app-assets/site-experience.js
      - run: python .github/scripts/test_gift_capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: required-gift-capture-staging
          path: qa/gift-capture-*
      - name: Save staging results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/gift-capture-*
          git diff --cached --quiet || git commit -m 'Record isolated required-gift capture checks; live delivery unverified'
          git push
