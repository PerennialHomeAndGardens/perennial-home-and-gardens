name: Functional QA of all garden tools and identifier uploads
on:
  push:
    branches: [tools-functional-qa-20261022]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 playwright pillow
      - name: Choose an available Chromium browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo 'PHG_QA_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
            google-chrome --version
          else
            python -m playwright install chromium --with-deps
          fi
      - run: |
          python .github/scripts/fix_tool_qa_findings.py
          python .github/scripts/test_all_garden_tools.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-garden-tools-qa
          path: qa/tools-functional-20261022.json
      - name: Save tested tool fixes and QA results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools qa
          git diff --cached --quiet || git commit -m 'Correct tool QA findings and save all-app functional test results'
          git push
