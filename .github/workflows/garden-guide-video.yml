name: Produce Perennial guide from live screenshots and supplied audio
on:
  push:
    branches: [garden-guide-video-20261021]
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright pillow beautifulsoup4
      - run: python -m playwright install chromium --with-deps
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: |
          python .github/scripts/build_garden_books.py
          python .github/scripts/finish_connected_garden.py
          python .github/scripts/build_garden_help.py
          python .github/scripts/test_connected_library.py
          python .github/scripts/produce_garden_guide.py
          python .github/scripts/test_garden_guide_video.py
      - name: Save tutorial and individual frames
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add help books tools articles legal index.html app-assets garden-books.html
          git diff --cached --quiet || git commit -m 'Prepare live-screen garden tutorial with supplied audio and 13 frames'
          git push
