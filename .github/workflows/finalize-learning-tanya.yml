name: Verify connected learning and Tanya
on:
  push:
    branches: [finish-connected-learning-and-tanya-20261020]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 playwright
      - run: python .github/scripts/build_learning.py
      - run: |
          node --check app-assets/site-experience.js
          node --check app-assets/tanya-assistant.js
          node --check app-assets/article-learning.js
          python -m playwright install chromium --with-deps
      - run: python .github/scripts/test_final_build.py
      - name: Save verified generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools articles legal app-assets qa
          git diff --cached --quiet || git commit -m 'Generate verified connected article pages and shared app shell'
          git push
